<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1440" height="900" fill="#ffffff"/>
  <line x1="86" y1="84" x2="1354" y2="84" stroke="#deded8"/>
  <text x="86" y="64" font-size="11" letter-spacing="2" fill="#6a7068">TRANSITION LAYER · SKETCH C · DIMENSIONAL TYPE (DEPTH PLANES) — REFINEMENT, NOT SIGNATURE</text>
  <!-- three shallow z-planes suggested by skewed rectangles -->
  <g>
    <polygon points="180,240 1240,200 1240,420 180,470" fill="none" stroke="#deded8"/>
    <polygon points="230,300 1190,268 1190,452 230,505" fill="none" stroke="#b9bdb4"/>
    <polygon points="286,364 1136,340 1136,488 286,540" fill="none" stroke="#9ba097" stroke-dasharray="3 4"/>
  </g>
  <!-- type on the front plane -->
  <text x="320" y="452" font-size="104" font-family="Arial Black, Arial, sans-serif" fill="#101410" letter-spacing="-6" transform="skewY(-1.6)">Zalando</text>
  <!-- receding ghost of the exiting route on the back plane -->
  <text x="360" y="330" font-size="56" font-family="Arial Black, Arial, sans-serif" fill="#b9bdb4" letter-spacing="-3" transform="skewY(-2.2)">Selected work.</text>
  <!-- travelling name path through depth -->
  <path d="M 470 322 C 560 360, 620 400, 680 430" fill="none" stroke="#101410" stroke-width="1" stroke-dasharray="1 5"/>
  <!-- annotations -->
  <text x="86" y="640" font-size="11" fill="#9ba097">PERSPECTIVE ~1200PX · TRANSLATEZ ±40PX · ROTATE &lt; 2° · CSS 3D ONLY (TRANSFORM IS ALREADY AN APPROVED PROPERTY)</text>
  <text x="86" y="660" font-size="11" fill="#9ba097">THE PROTECTED EXIT/RESOLVE AND TRAVELLING NAME GAIN A Z-AXIS · SNAPS TO IDENTITY AT REST (NO TEXT BLUR)</text>
  <text x="86" y="680" font-size="11" fill="#9ba097">TOO QUIET TO BE THE SIGNATURE ALONE — CANDIDATE FOR THE BOUNDED P2 MOTION PASS ONLY IF A PROTOTYPE IS VISIBLY BETTER</text>
  <text x="86" y="812" font-size="11" letter-spacing="2" fill="#6a7068">RECOMMENDED VERDICT: OPTIONAL P2 REFINEMENT INSIDE THE PROTECTED TRANSITIONS</text>
</svg>
